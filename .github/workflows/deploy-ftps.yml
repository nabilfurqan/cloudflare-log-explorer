name: Deploy to cPanel via FTPS

on:
  push:
    branches:
      - main
    paths:
      - 'index.php'
      - '.htaccess'
      - 'favicon.ico'
      - 'api/**'
      - 'assets/**'
      - 'lib/**'
      - '.github/workflows/deploy-ftps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-logpull
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit SHA
        with:
          persist-credentials: false

      - name: Validate PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Reject obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|CF_API_TOKEN[[:space:]]*=[[:space:]]*[A-Za-z0-9_-]{20,})' .; then
            echo 'Potential committed secret detected. Refusing deployment.' >&2
            exit 1
          fi

      - name: Prepare deployment package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deploy
          mkdir -p .deploy/api .deploy/assets .deploy/lib
          cp index.php .deploy/index.php
          cp .htaccess .deploy/.htaccess
          cp favicon.ico .deploy/favicon.ico
          cp -R api/. .deploy/api/
          cp -R assets/. .deploy/assets/
          cp -R lib/. .deploy/lib/
          printf '%s\n' "$GITHUB_SHA" > .deploy/.deployment-sha

          if find .deploy -type l -print -quit | grep -q .; then
            echo 'Symlinks are not allowed in the production deployment package.' >&2
            exit 1
          fi

      - name: Install FTPS client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Deploy application files over explicit FTPS
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?Missing FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD secret}"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 kemiri.iixcp.rumahweb.net <<'EOF'
          set cmd:fail-exit yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:ssl-auth TLS
          set ssl:verify-certificate yes
          set ftp:passive-mode true
          set net:max-retries 2
          set net:timeout 20
          mirror -R --verbose --parallel=2 .deploy/ /
          bye
          EOF

      - name: Verify deployed revision over FTPS
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_USERNAME:?Missing FTP_USERNAME secret}"
          : "${FTP_PASSWORD:?Missing FTP_PASSWORD secret}"

          REMOTE_SHA="$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 kemiri.iixcp.rumahweb.net -e '
            set cmd:fail-exit yes;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:ssl-auth TLS;
            set ssl:verify-certificate yes;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 20;
            cat /.deployment-sha;
            bye
          ' | tr -d '\r\n')"

          if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
            echo "Remote deployment revision mismatch." >&2
            echo "Expected: $GITHUB_SHA" >&2
            echo "Received: $REMOTE_SHA" >&2
            exit 1
          fi

          echo "FTPS deployment revision verified: $REMOTE_SHA"

      - name: Public edge smoke test
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_UA='CloudNetworkLab-Deployment-SmokeTest/1.0 (+https://logpull.cloudnetworklab.com/)'
          HEADER_FILE="$(mktemp)"
          BODY_FILE="$(mktemp)"
          trap 'rm -f "$HEADER_FILE" "$BODY_FILE"' EXIT

          HTTP_CODE="$(curl --silent --show-error \
            --user-agent "$SMOKE_UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            -D "$HEADER_FILE" -o "$BODY_FILE" -w '%{http_code}' \
            https://logpull.cloudnetworklab.com/ || true)"

          if [[ "$HTTP_CODE" == "200" ]]; then
            grep -qi '^strict-transport-security:' "$HEADER_FILE"
            grep -qi '^x-content-type-options:[[:space:]]*nosniff' "$HEADER_FILE"
            grep -qi '^x-frame-options:[[:space:]]*DENY' "$HEADER_FILE"
            grep -qi '^content-security-policy:' "$HEADER_FILE"
            echo 'Public endpoint returned HTTP 200 and required security headers are present.'
            exit 0
          fi

          if [[ "$HTTP_CODE" == "403" ]]; then
            echo '::warning::Cloudflare edge policy returned HTTP 403 to the GitHub-hosted runner. The deployed revision was already verified over FTPS, so this is treated as an edge-policy warning rather than a deployment failure.'
            exit 0
          fi

          echo "Public endpoint returned unexpected HTTP $HTTP_CODE." >&2
          head -c 500 "$BODY_FILE" >&2 || true
          exit 1

# Intentionally no `mirror --delete` yet.
# Enable deletion only after the cPanel/FTPS account is verified to be jailed exclusively
# to the logpull.cloudnetworklab.com document root; otherwise it could delete unrelated files.
