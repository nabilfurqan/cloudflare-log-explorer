name: Deploy to cPanel via SFTP

on:
  push:
    branches:
      - main
    paths:
      - 'index.php'
      - '.htaccess'
      - 'api/**'
      - 'assets/**'
      - 'lib/**'
      - '.github/workflows/deploy-sftp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-logpull
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY secret}"
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application files with SFTP
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          PORT="${SSH_PORT:-22}"
          TARGET='/home/clob9339/public_html/logpull'

          cat > /tmp/sftp-batch <<EOF
          cd $TARGET
          put index.php index.php
          put .htaccess .htaccess
          put -r api
          put -r assets
          put -r lib
          EOF

          sftp \
            -i ~/.ssh/id_deploy \
            -P "$PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -b /tmp/sftp-batch \
            "$SSH_USER@$SSH_HOST"

      - name: Smoke test production
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://logpull.cloudnetworklab.com/ > /dev/null
          echo 'Deployment smoke test passed.'
