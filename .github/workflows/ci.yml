name: CI Security Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned by commit SHA
        with:
          persist-credentials: false

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find assets -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check for obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|CF_API_TOKEN[[:space:]]*=[[:space:]]*["'"'][A-Za-z0-9_-]{20,}["'"'])' .; then
            echo 'Potential committed secret detected.' >&2
            exit 1
          fi

      - name: Security regression checks
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn "return 'plain:'" lib
          ! grep -RIn "if (\$scheme === 'plain').*return \$raw" lib
          grep -q "connect-src 'self' https://cdn.jsdelivr.net" index.php
          grep -q "CURLOPT_SSL_VERIFYPEER" lib/cloudflare.php
          grep -q "is_cloudflare_proxy_ip" lib/cloudflare.php
          grep -q "Options -Indexes" .htaccess
